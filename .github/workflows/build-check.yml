name: Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build
        env:
          # Dummy values so the build step doesn't fail on missing env vars —
          # this job only checks that the code compiles/bundles, it doesn't
          # need a real Supabase project. Real values live in Vercel's env
          # var settings for the actual deploy.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
